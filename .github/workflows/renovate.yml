name: renovate

# The client Nix repository owns its Renovate workflow and policy. The shared
# META credential authenticates ordinary GitHub operations without repository
# Administration access; each invocation targets only github.repository.

on:
  schedule:
    - cron: "0 12 * * 4" # Weekly Thursday 21:00 KST; Renovate is unrestricted to tolerate dispatch delays/manual invocation.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without opening PRs"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Verify Renovate token access
        env:
          RENOVATE_TOKEN: ${{ secrets.META_HOMELAB_GITHUB_PAT }}
        run: |
          python3 - <<'PYTHON'
          import os, sys, urllib.error, urllib.request
          base = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          for target in ("user", f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls?state=all&per_page=1"):
              request = urllib.request.Request(f"{base}/{target}", headers={
                  "Authorization": "Bearer " + os.environ["RENOVATE_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          raise OSError("unexpected status")
              except urllib.error.HTTPError as error:
                  print(f"::error title=Renovate token access::{target}: HTTP {error.code}")
                  sys.exit(1)
              except OSError:
                  print(f"::error title=Renovate token access::{target}: request failed")
                  sys.exit(1)
          PYTHON

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.META_HOMELAB_GITHUB_PAT }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
          # Scheduled runs respect renovate.json. A manual run is an explicit
          # request to inspect this repository's queue immediately.
          RENOVATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '{"schedule":null}' || '{}' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: info
        run: nix run --inputs-from . nixpkgs#renovate --
