name: renovate

# The client Nix repository owns its Renovate workflow and token. Keeping this
# workflow repository-local prevents a credential or configuration failure in
# one repository from affecting the other.

on:
  schedule:
    - cron: "0 12 * * 4" # Thursday 21:00 KST, matching renovate.json's window
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without opening PRs"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Verify Renovate token access
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          identity_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $RENOVATE_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/user")"
          if [ "$identity_status" != 200 ]; then
            echo "::error title=Renovate token authentication::GitHub /user returned HTTP $identity_status"
            exit 1
          fi

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $RENOVATE_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=1")"
          if [ "$status" != 200 ]; then
            echo "::error title=Renovate token access::$GITHUB_REPOSITORY pull-request access returned HTTP $status"
            exit 1
          fi

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
          # Scheduled runs respect renovate.json. A manual run is an explicit
          # request to inspect this repository's queue immediately.
          RENOVATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '{"schedule":null}' || '{}' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: info
        run: nix run --inputs-from . nixpkgs#renovate --
