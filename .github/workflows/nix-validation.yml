name: Nix validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux flake checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The hash verify step evaluates the working tree as a git+file flake,
          # which Nix refuses on a shallow clone (no revCount).
          fetch-depth: 0

      - name: Test release hash updater
        run: python3 scripts/test-renovate-release-hashes.py

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Evaluate all flake outputs
        run: nix flake check --no-build --all-systems

      - name: Build Linux Home Manager activation package
        run: nix build --no-link '.#homeConfigurations."dididi@sg-lenovo".activationPackage'

      - name: Evaluate WSL Home Manager activation package
        run: nix eval --raw '.#homeConfigurations."dididi@sg-asus".activationPackage.drvPath' >/dev/null

      - name: Evaluate NixOS and WSL systems
        run: |
          nix eval --raw '.#nixosConfigurations.sg-lenovo.config.system.build.toplevel.drvPath' >/dev/null
          nix eval --raw '.#nixosConfigurations.sg-asus.config.system.build.toplevel.drvPath' >/dev/null

      - name: Verify Kime source hash
        run: nix build --no-link '.#nixosConfigurations.sg-lenovo.pkgs.kime.unwrapped.src'

      # Evaluation does not check fixed-output hashes. Realise every fetch whose
      # derivation this PR changed so a stale hash fails here instead of after
      # merge; Renovate PRs therefore need no manual hash label.
      - name: Verify changed fixed-output hashes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          bash scripts/renovate-update-hashes.sh --verify "origin/${BASE_REF}"

  darwin:
    name: Darwin flake evaluation
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Evaluate Darwin system outputs
        run: |
          nix eval --raw '.#darwinConfigurations.sg-macbook.config.system.build.toplevel' >/dev/null
          nix eval --raw '.#darwinConfigurations.us-mbpro2311-sg.config.system.build.toplevel' >/dev/null

      - name: Evaluate Darwin Home Manager outputs
        run: |
          nix eval --raw '.#homeConfigurations."dididi@sg-macbook".activationPackage.drvPath' >/dev/null
          nix eval --raw '.#homeConfigurations."dididi@us-mbpro2311-sg".activationPackage.drvPath' >/dev/null

      - name: Build Darwin Home Manager activation package
        run: |
          nix build --no-link '.#homeConfigurations."dididi@sg-macbook".activationPackage'
          nix build --no-link '.#homeConfigurations."dididi@us-mbpro2311-sg".activationPackage'
